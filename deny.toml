[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2024-0370", # unmaintained: proc-macro-error via genawaiter, no maintained genawaiter release
    "RUSTSEC-2023-0089", # unmaintained: atomic-polyfill via postcard -> heapless 0.7, dev-dependency only
    "RUSTSEC-2024-0375", # unmaintained: atty via criterion 0.4, dev-dependency only
]

[bans]
multiple-versions = "allow"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
]

# The cli crate is an unpublished dev tool.
[licenses.private]
ignore = true

[sources]
allow-git = []
